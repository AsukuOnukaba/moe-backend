services:
  db:
    image: postgres:16
    container_name: moe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moe_dev
    ports:
      - "5432:5432"
    volumes:
      - moe_pg_data:/var/lib/postgresql/data

volumes:
  moe_pg_data:
